{% extends "base.html" %}

{% block content %}
<div style="max-width: 32rem; margin: 0 auto; width: 100%;">
    <div style="text-align: center; margin-bottom: 2.5rem;">
        <h2 style="font-size: 2.25rem; font-weight: 800; color: #ffffff; margin-bottom: 0.5rem;">
            ¿Iniciamos una <span style="color: #22d3ee;">Propuesta</span>?
        </h2>
        <p style="color: #94a3b8; font-size: 1rem; font-weight: 300;">
            Completa los detalles y coordinemos una llamada técnica.
        </p>
    </div>

    {% if exito %}
    <div style="background-color: rgba(20, 184, 166, 0.1); border: 1px solid #14b8a6; color: #14b8a6; padding: 1rem; border-radius: 0.75rem; margin-bottom: 1.5rem; font-size: 0.9rem; text-align: center;">
        {{ exito }}
    </div>
    {% endif %}

    <form action="/contacto" method="POST" style="background-color: #0f172a; border: 1px solid #1e293b; border-radius: 1rem; padding: 2rem; display: flex; flex-direction: column; gap: 1.25rem;">
        <div>
            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #94a3b8; margin-bottom: 0.5rem;" for="nombre">Nombre / Empresa</label>
            <input type="text" id="nombre" name="nombre" required style="width: 100%; background-color: #020617; border: 1px solid #1e293b; border-radius: 0.5rem; padding: 0.75rem 1rem; color: #ffffff; font-size: 0.95rem; outline: none;">
        </div>
        <div>
            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #94a3b8; margin-bottom: 0.5rem;" for="correo">Correo de Contacto</label>
            <input type="email" id="correo" name="correo" required style="width: 100%; background-color: #020617; border: 1px solid #1e293b; border-radius: 0.5rem; padding: 0.75rem 1rem; color: #ffffff; font-size: 0.95rem; outline: none;">
        </div>
        <div>
            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #94a3b8; margin-bottom: 0.5rem;" for="mensaje">Propuesta de empleo o proyecto</label>
            <textarea id="mensaje" name="mensaje" rows="4" required style="width: 100%; background-color: #020617; border: 1px solid #1e293b; border-radius: 0.5rem; padding: 0.75rem 1rem; color: #ffffff; font-size: 0.95rem; outline: none; resize: none;"></textarea>
        </div>
        <button type="submit" style="width: 100%; background-color: #22d3ee; color: #020617; font-weight: 700; padding: 0.85rem; border-radius: 0.5rem; border: none; font-size: 0.95rem; cursor: pointer;">
            Enviar Propuesta
        </button>
    </form>
</div>
{% endblock %}
